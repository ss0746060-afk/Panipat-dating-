<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Login - Zomato Dating</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #05010d;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05010d 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* लॉगिन बॉक्स कंटेनर */
        .login-container {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 10, 35, 0.65);
            border: 1px solid rgba(255, 0, 127, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 0, 127, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* ग्लोइंग बैकग्राउंड इफेक्ट्स */
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #ff007f);
            animation: rotateGlow 6s linear infinite;
            z-index: -1;
            opacity: 0.3;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff007f, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8b8ba7;
            margin-bottom: 35px;
        }

        /* इनपुट फील्ड्स स्टाइल */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a6a8a;
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #00f0ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .input-group input:focus + i {
            color: #00f0ff;
        }

        /* वीआईपी सबमिट बटन */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.3);
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.6);
        }

        /* एनिमेशन स्क्रीन (लॉगिन सक्सेस होने पर) */
        .success-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d061a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .success-icon {
            font-size: 3.5rem;
            color: #00f0ff;
            margin-bottom: 15px;
            animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes scaleUp {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #6a6a8a;
        }

        .footer-text span {
            color: #ff007f;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="logo-text">Zomato Dating</div>
        <div class="subtitle">हरियाणा का नंबर 1 VIP सोशल क्लब 👑</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="मोबाइल नंबर या यूजरनेम" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="वीआईपी एक्सेस कोड (पासवर्ड)" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <button type="submit" class="login-btn">
                एंट्री लें <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="footer-text">
            नॉन-VIP मेंबर हैं? <span onclick="alert('VIP रजिस्ट्रेशन जल्द ही शुरू हो रहा है!')">नया अकाउंट बनाएं</span>
        </div>

        <div class="success-overlay" id="successOverlay">
            <i class="fa-solid fa-shield-cat success-icon"></i>
            <h2 style="color: white; margin-bottom: 5px; font-weight: 800; letter-spacing: 1px;">ACCESS GRANTED</h2>
            <p style="color: #00f0ff; font-size: 0.85rem;">VIP प्रोफाइल लोड हो रही है...</p>
        </div>

    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // फॉर्म को डिफ़ॉल्ट रीलोड होने से रोकने के लिए
            
            // सक्सेस स्क्रीन दिखाना
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');

            // 2 सेकंड का वीआईपी एनिमेशन होल्ड करके होमपेज (index.html) पर भेजना
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>
</html>
