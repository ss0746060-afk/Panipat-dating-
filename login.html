<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access & Registration - Zomato Dating</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #05010d; background: radial-gradient(circle at center, #1a0b2e 0%, #05010d 100%);
            color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .login-container {
            width: 100%; max-width: 400px; background: rgba(20, 10, 35, 0.65); border: 1px solid rgba(255, 0, 127, 0.2);
            border-radius: 24px; padding: 35px 25px; text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;
        }
        .logo-text { font-size: 2.2rem; font-weight: 900; background: linear-gradient(45deg, #ff007f, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .subtitle { font-size: 0.9rem; color: #8b8ba7; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #6a6a8a; }
        .input-group input { width: 100%; padding: 14px 15px 14px 45px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none; font-size: 0.95rem; }
        .input-group input:focus { border-color: #00f0ff; background: rgba(255, 255, 255, 0.08); }
        
        .login-btn { width: 100%; background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%); color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .footer-text { margin-top: 25px; font-size: 0.85rem; color: #6a6a8a; }
        .footer-text span { color: #00f0ff; cursor: pointer; font-weight: 600; }

        /* रजिस्ट्रेशन के लिए विशेष अवतार अपलोड */
        .avatar-upload { position: relative; width: 80px; height: 80px; margin: 0 auto 20px auto; cursor: pointer; }
        .avatar-upload img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px dashed #ff007f; }
        .avatar-upload .plus-icon { position: absolute; bottom: 0; right: 0; background: #00f0ff; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: black; font-size: 0.75rem; }

        .hidden-form { display: none; }

        .success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0d061a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .success-overlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-text">Zomato Dating</div>
        
        <div id="loginBox">
            <div class="subtitle">हरियाणा का नंबर 1 VIP सोशल क्लब 👑</div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="loginUser" placeholder="यूजरनेम दर्ज करें" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPass" placeholder="पासवर्ड" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="login-btn">एंट्री लें <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </form>
            <div class="footer-text">नॉन-VIP मेंबर हैं? <span onclick="toggleForms('register')">नया अकाउंट बनाएं</span></div>
        </div>

        <div id="registerBox" class="hidden-form">
            <div class="subtitle">अपना नया टैलेंट अकाउंट रजिस्टर करें ✨</div>
            <form onsubmit="handleRegister(event)">
                <input type="file" id="regFileInput" accept="image/*" style="display: none;" onchange="previewRegAvatar(event)">
                <div class="avatar-upload" onclick="document.getElementById('regFileInput').click()">
                    <img id="regAvatarPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Upload">
                    <div class="plus-icon"><i class="fa-solid fa-camera"></i></div>
                </div>
                <div class="input-group">
                    <input type="text" id="regName" placeholder="आपका पूरा नाम" required>
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="regUser" placeholder="यूनिक यूजरनेम सेट करें" required>
                    <i class="fa-solid fa-at"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="regPass" placeholder="मजबूत पासवर्ड बनाएं" required>
                    <i class="fa-solid fa-key"></i>
                </div>
                <button type="submit" class="login-btn">अकाउंट बनाएं <i class="fa-solid fa-user-plus"></i></button>
            </form>
            <div class="footer-text">पहले से अकाउंट है? <span onclick="toggleForms('login')">लॉगिन करें</span></div>
        </div>

        <div class="success-overlay" id="successOverlay">
            <i class="fa-solid fa-circle-check" style="font-size: 3.5rem; color: #00f0ff; margin-bottom: 15px;"></i>
            <h2 id="successStatusText" style="color: white; font-weight: 800; letter-spacing: 1px;">ACCESS GRANTED</h2>
            <p style="color: #00f0ff; font-size: 0.85rem;">प्रोफाइल लोड हो रही है...</p>
        </div>
    </div>

    <script>
        let selectedAvatarBase64 = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100";

        function toggleForms(type) {
            if(type === 'register') {
                document.getElementById('loginBox').classList.add('hidden-form');
                document.getElementById('registerBox').classList.remove('hidden-form');
            } else {
                document.getElementById('registerBox').classList.add('hidden-form');
                document.getElementById('loginBox').classList.remove('hidden-form');
            }
        }

        function previewRegAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedAvatarBase64 = e.target.result;
                document.getElementById('regAvatarPreview').src = selectedAvatarBase64;
            };
            reader.readAsDataURL(file);
        }

        // 📝 अकाउंट रजिस्ट्रेशन लॉजिक
        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;

            let usersDb = JSON.parse(localStorage.getItem('network_users_db') || '{}');
            
            if(usersDb[user]) {
                alert('यह यूजरनेम पहले से बुक है! कोई दूसरा चुनें।');
                return;
            }

            // नया यूजर ऑब्जेक्ट डेटाबेस में डालना
            usersDb[user] = { name: name, username: user, password: pass, pic: selectedAvatarBase64 };
            localStorage.setItem('network_users_db', JSON.stringify(usersDb));

            alert('बधाई हो! आपका इंस्टाग्राम स्टाइल टैलेंट अकाउंट बन गया। अब लॉगिन करें!');
            toggleForms('login');
            document.getElementById('loginUser').value = user;
        }

        // 🔓 लॉगिन लॉजिक
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            let usersDb = JSON.parse(localStorage.getItem('network_users_db') || '{}');

            // डिफ़ॉल्ट एडमिन चेक (अगर DB खाली हो)
            if(user === "राव_साहब_HR06" && pass === "1234") {
                executeLogin("अमित राव", "राव_साहब_HR06", "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200");
                return;
            }

            if(usersDb[user] && usersDb[user].password === pass) {
                executeLogin(usersDb[user].name, usersDb[user].username, usersDb[user].pic);
            } else {
                alert('गलत यूजरनेम या पासवर्ड! कृपया सही विवरण डालें।');
            }
        }

        function executeLogin(name, username, pic) {
            // वर्तमान में एक्टिव यूजर का सेशन सेट करना
            localStorage.setItem('current_logged_in_user', username);
            localStorage.setItem('vip_name', name);
            localStorage.setItem('vip_user', username);
            localStorage.setItem('vip_pic', pic);

            document.getElementById('successStatusText').innerText = "ACCESS GRANTED";
            document.getElementById('successOverlay').classList.add('active');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>
</html>
