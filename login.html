<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { width: 100%; max-width: 380px; background: #121212; border: 1px solid #333; border-radius: 10px; padding: 30px; }
        .logo-text { font-size: 2rem; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; background: #262626; border: 1px solid #444; color: white; border-radius: 5px; }
        .action-btn { width: 100%; background: #0095f6; border: none; padding: 12px; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-text">Instagram</div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group"><input type="text" id="loginIdentifier" placeholder="यूजरनेम" required></div>
            <div class="input-group"><input type="password" id="loginPass" placeholder="पासवर्ड" required></div>
            <button type="submit" class="action-btn">लॉगिन करें</button>
        </form>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('loginIdentifier').value;
            localStorage.setItem('current_logged_in_user', user);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
