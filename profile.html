<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Profile - Zomato Dating</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #05010d; background: radial-gradient(circle at top, #1a0b2e 0%, #05010d 100%);
            color: #ffffff; display: flex; justify-content: center; min-height: 100vh;
        }
        .app-container { width: 100%; max-width: 450px; background: rgba(15, 8, 28, 0.8); min-height: 100vh; padding-bottom: 70px; }
        .profile-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .username { font-size: 1.2rem; font-weight: bold; color: #00f0ff; }
        
        .profile-info { padding: 20px; display: flex; align-items: center; gap: 25px; }
        .profile-avatar { width: 85px; height: 85px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #ff007f, #00f0ff); }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .profile-stats { display: flex; gap: 20px; text-align: center; flex: 1; justify-content: space-around; }
        .stat-num { font-size: 1.1rem; font-weight: bold; }
        .stat-label { font-size: 0.75rem; color: #8b8ba7; }
        
        .profile-bio { padding: 0 20px 15px 20px; }
        .full-name { font-weight: bold; margin-bottom: 4px; }
        .bio-text { font-size: 0.9rem; color: #ddd; }
        
        /* टैब बार (पोस्ट्स बनाम रील्स) */
        .profile-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); margin-top: 10px; }
        .tab-item { flex: 1; text-align: center; padding: 12px; color: #8b8ba7; cursor: pointer; font-size: 1.2rem; }
        .tab-item.active { color: #00f0ff; border-bottom: 2px solid #00f0ff; }

        .instagram-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
        .grid-item { aspect-ratio: 1 / 1; position: relative; background: #110922; overflow: hidden; }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .reel-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; color: #ff007f; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: rgba(5, 1, 13, 0.95); display: flex; justify-content: space-around; align-items: center; padding: 15px 0; font-size: 1.4rem; z-index: 10; border-top: 1px solid rgba(255,255,255,0.08); }
        .nav-item { cursor: pointer; color: #8b8ba7; text-decoration: none; }
        .nav-item.active { color: #00f0ff; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="profile-header">
            <div class="username" id="displayUsername">राव_साहब_HR06</div>
            <i class="fa-solid fa-bars"></i>
        </header>

        <div class="profile-info">
            <div class="profile-avatar"><img id="displayAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200"></div>
            <div class="profile-stats">
                <div><div class="stat-num" id="postCount">0</div><div class="stat-label">पोस्ट्स</div></div>
                <div><div class="stat-num">4.8K</div><div class="stat-label">फॉलोअर्स</div></div>
                <div><div class="stat-num">340</div><div class="stat-label">मैचेस</div></div>
            </div>
        </div>

        <div class="profile-bio">
            <div class="full-name" id="displayName">अमित राव</div>
            <div class="bio-text">📍 पानीपत, हरियाणा <br> Zomato Dating VIP मेंबर 👑</div>
        </div>

        <div class="profile-tabs">
            <div class="tab-item active" id="postsTab" onclick="switchTab('posts')"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="reelsTab" onclick="switchTab('reels')"><i class="fa-solid fa-film"></i></div>
        </div>

        <div class="instagram-grid" id="profileGrid">
            </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
            <i class="fa-solid fa-magnifying-glass nav-item"></i>
            <a href="index.html" class="nav-item"><i class="fa-regular fa-square-plus"></i></a>
            <a href="chat.html" class="nav-item"><i class="fa-regular fa-message"></i></a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i></a>
        </nav>
    </div>

    <script>
        let currentView = 'posts';

        window.addEventListener('load', () => {
            // प्रोफाइल डेटा सेट करना
            document.getElementById('displayName').innerText = localStorage.getItem('vip_name') || "अमित राव";
            document.getElementById('displayUsername').innerText = localStorage.getItem('vip_user') || "राव_साहब_HR06";
            document.getElementById('displayAvatar').src = localStorage.getItem('vip_pic') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200";
            
            renderGrid();
        });

        function switchTab(tab) {
            currentView = tab;
            document.getElementById('postsTab').classList.toggle('active', tab === 'posts');
            document.getElementById('reelsTab').classList.toggle('active', tab === 'reels');
            renderGrid();
        }

        // लोकल स्टोरेज से मीडिया निकालकर ग्रिड में सजाना
        function renderGrid() {
            const grid = document.getElementById('profileGrid');
            grid.innerHTML = '';
            
            const savedItems = JSON.parse(localStorage.getItem('my_uploaded_media') || '[]');
            document.getElementById('postCount').innerText = savedItems.length;

            const filtered = savedItems.filter(item => currentView === 'reels' ? item.type === 'reel' : item.type !== 'reel');

            if(filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 3; text-align:center; padding:40px; color:#6a6a8a; font-size:0.9rem;">कोई कन्टेंट नहीं है। होमपेज से अपलोड करें!</div>`;
                return;
            }

            filtered.forEach(item => {
                let html = '';
                if(item.type === 'video' || item.type === 'reel') {
                    html = `
                        <div class="grid-item">
                            <video src="${item.url}" muted loop autoplay></video>
                            ${item.type === 'reel' ? '<div class="reel-badge"><i class="fa-solid fa-film"></i> रील</div>' : ''}
                        </div>`;
                } else {
                    html = `<div class="grid-item"><img src="${item.url}"></div>`;
                }
                grid.insertAdjacentHTML('beforeend', html);
            });
        }
    </script>
</body>
</html>
