<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; }
        .profile-container { width: 100%; max-width: 450px; padding: 20px; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #444; object-fit: cover; }
        .edit-btn { background: #333; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; margin-top: 10px; display: inline-block; }
        .input-box { width: 100%; background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .save-btn { width: 100%; background: #0095f6; border: none; color: white; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="profile-container">
    <h2>प्रोफाइल एडिट करें</h2>
    <div class="profile-header">
        <img id="myAvatar" src="" class="profile-pic">
        <div>
            <h3 id="displayName"></h3>
            <p id="displayUser" style="color: #888;"></p>
        </div>
    </div>

    <input type="text" id="editName" class="input-box" placeholder="नाम लिखें">
    <input type="text" id="editUser" class="input-box" placeholder="यूजरनेम लिखें">
    <input type="text" id="editBio" class="input-box" placeholder="बायो लिखें">
    <input type="file" id="picUpload" accept="image/*" style="display:none" onchange="previewPic(event)">
    <div class="edit-btn" onclick="document.getElementById('picUpload').click()">प्रोफाइल फोटो बदलें</div>
    
    <button class="save-btn" onclick="saveProfile()" style="margin-top: 20px;">सेव करें</button>
    <button class="save-btn" style="background:#444; margin-top:10px;" onclick="location.href='index.html'">वापस फीड पर जाएँ</button>
</div>

<script>
    let currentUser = localStorage.getItem('current_logged_in_user');
    let db = JSON.parse(localStorage.getItem('secure_users_db') || '{}');
    let userData = db[currentUser] || {name: "Guest", username: currentUser, bio: "अपनी लाइफ, अपना स्वैग!", pic: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100"};

    // पेज लोड होते ही डेटा भरें
    document.getElementById('displayName').innerText = userData.name;
    document.getElementById('displayUser').innerText = "@" + userData.username;
    document.getElementById('myAvatar').src = userData.pic;
    document.getElementById('editName').value = userData.name;
    document.getElementById('editUser').value = userData.username;
    document.getElementById('editBio').value = userData.bio || "";

    // फोटो प्रीव्यू
    function previewPic(e) {
        let reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('myAvatar').src = event.target.result;
            userData.pic = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }

    // डेटा सेव करना
    function saveProfile() {
        userData.name = document.getElementById('editName').value;
        userData.username = document.getElementById('editUser').value;
        userData.bio = document.getElementById('editBio').value;
        
        db[currentUser] = userData;
        localStorage.setItem('secure_users_db', JSON.stringify(db));
        localStorage.setItem('vip_name', userData.name);
        localStorage.setItem('vip_user', userData.username);
        localStorage.setItem('vip_pic', userData.pic);
        
        alert("प्रोफाइल अपडेट हो गई! ✅");
        location.reload();
    }
</script>
</body>
</html>
