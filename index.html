<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Dating</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="top-nav">
        <h1>ZomatoDating</h1>
        <i class="fa-regular fa-paper-plane"></i>
    </header>

    <div class="story-container">
        <div class="story"><div class="img-circle"></div><span>आप</span></div>
        <div class="story"><div class="img-circle"></div><span>रिया</span></div>
        <div class="story"><div class="img-circle"></div><span>राहुल</span></div>
    </div>

    <div class="feed" id="feed"></div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-plus-square"></i>
        <i class="fa-solid fa-heart"></i>
        <i class="fa-solid fa-user"></i>
    </nav>

    <script src="script.js"></script>
</body>
</html>
