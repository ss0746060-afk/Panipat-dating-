<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Dating | Premium Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ZomatoDating</div>
        <div class="nav-links">
            <i class="fa-solid fa-house"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-plus-square"></i>
            <i class="fa-solid fa-heart"></i>
            <i class="fa-solid fa-user"></i>
        </div>
    </nav>

    <div class="main-content">
        <div class="stories">
            <div class="story-circle"><div class="img"></div><span>मेरी स्टोरी</span></div>
            <div class="story-circle"><div class="img"></div><span>प्रिया</span></div>
            <div class="story-circle"><div class="img"></div><span>राहुल</span></div>
        </div>

        <div class="feed" id="feed">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
