<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panipat Connect - Instagram Edition</title>
    
    <style>
        /* इंस्टाग्राम थीम डिज़ाइन */
        body { 
            margin: 0; padding: 0; 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fafafa; color: #262626; 
        }
        
        /* 1. इंस्टाग्राम जैसा हेडर */
        .insta-header { 
            background-color: white; 
            border-bottom: 1px solid #dbdbdb; 
            position: sticky; top: 0; z-index: 100; 
            padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .insta-header h1 { 
            font-family: 'Arial', sans-serif; font-size: 22px; font-weight: bold; margin: 0; color: #e53935;
        }
        .search-box {
            background: #efefef; border: none; padding: 7px 15px; border-radius: 8px; font-size: 14px; outline: none; width: 140px;
        }

        /* मुख्य कंटेनर */
        .main-feed { max-width: 600px; margin: 0 auto; padding-bottom: 60px; }

        /* 2. इंस्टाग्राम स्टोरीज सेक्शन */
        .stories-container { 
            display: flex; gap: 12px; overflow-x: auto; padding: 15px 10px; 
            background: white; border-bottom: 1px solid #dbdbdb; margin-bottom: 10px;
        }
        .stories-container::-webkit-scrollbar { display: none; }
        .story { text-align: center; font-size: 11px; min-width: 65px; cursor: pointer; }
        .story-img-wrapper {
            width: 56px; height: 56px; border-radius: 50%; 
            padding: 2px; border: 2px solid #e53935; margin: 0 auto 4px auto;
        }
        .story img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* 3. इंस्टाग्राम पोस्ट कार्ड (Feed Posts) */
        .insta-post { background: white; border: 1px solid #dbdbdb; margin-bottom: 15px; border-radius: 3px; }
        .post-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .post-header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .post-header .user-info { font-size: 14px; font-weight: 600; }
        .post-header .location { font-size: 11px; color: #8e8e8e; font-weight: normal; }
        
        .post-img { width: 100%; max-height: 500px; object-fit: cover; background-color: #eee; }
        
        /* पोस्ट के बटन्स */
        .post-actions { padding: 10px 12px 5px 12px; display: flex; gap: 15px; font-size: 22px; }
        .action-btn { cursor: pointer; transition: transform 0.1s ease; user-select: none; }
        .action-btn:active { transform: scale(1.2); }
        .like-active { color: #e53935; }

        .likes-display { padding: 0 12px; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        
        /* कमेंट्स की जगह */
        .comments-section { padding: 0 12px; font-size: 14px; margin-bottom: 8px; }
        .comment-item { margin-bottom: 4px; }
        .comment-item b { margin-right: 6px; }
        
        /* कमेंट टाइप करने का बॉक्स */
        .comment-form { 
            border-top: 1px solid #efefef; padding: 10px 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .comment-input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; }
        .comment-post-btn { color: #0095f6; border: none; background: none; font-weight: 600; font-size: 14px; cursor: pointer; }

        /* 4. नीचे का नेविगेशन बार (Bottom Nav Bar) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #dbdbdb;
            display: flex; justify-content: space-around; padding: 12px 0;
            font-size: 20px; z-index: 100;
        }
        .nav-item { cursor: pointer; color: #262626; }
    </style>
</head>
<body>

    <div class="insta-header">
        <h1>Panipat Connect</h1>
        <input type="text" class="search-box" placeholder="खोजें...">
    </div>

    <div class="main-feed">
        
        <div class="stories-container">
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=11"></div><span>विकास</span></div>
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=5"></div><span>कविता</span></div>
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=12"></div><span>संदीप</span></div>
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=9"></div><span>अंजलि</span></div>
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=13"></div><span>दीपक</span></div>
            <div class="story" onclick="alert('स्टोरी अभी उपलब्ध नहीं है')"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=16"></div><span>मनोज</span></div>
        </div>

        <div id="insta-posts-feed"></div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="alert('होम पेज')">🏠</div>
        <div class="nav-item" onclick="openChatBot()">💬</div>
        <div class="nav-item" onclick="alert('नई पोस्ट अपलोड करें (जल्द आ रहा है)')">➕</div>
        <div class="nav-item" onclick="alert('अपनी प्रोफाइल')">👤</div>
    </div>

    <script>
        // इंस्टाग्राम पोस्ट्स का असली डेटाबेस (इमेज लिंक्स के साथ)
        const postsData = [
            {
                id: "post_1",
                user: "विकास मलिक",
                userImg: "https://i.pravatar.cc/150?img=11",
                location: "मॉडल टाउन, पानीपत",
                postImg: "https://picsum.photos/id/10/600/500", // सुंदर प्राकृतिक दृश्य
                caption: "आज का मौसम पानीपत में बेहद शानदार है! 🌤️ #panipat #goodvibes",
                likes: 124,
                comments: [
                    { user: "कविता", text: "बिलकुल भाई, यहाँ भी मस्त हवा चल रही है।" }
                ]
            },
            {
                id: "post_2",
                user: "कविता चौधरी",
                userImg: "https://i.pravatar.cc/150?img=5",
                location: "सेक्टर 11, पानीपत",
                postImg: "https://picsum.photos/id/26/600/500", // स्टाइलिश कार/रोड फोटो
                caption: "लॉन्ग ड्राइव पर समालखा की तरफ! 🚗💨 #travel",
                likes: 89,
                comments: [
                    { user: "संदीप", text: "हैव अ सेफ जर्नी!" }
                ]
            },
            {
                id: "post_3",
                user: "संदीप जांगड़ा",
                userImg: "https://i.pravatar.cc/150?img=12",
                location: "रिफाइनरी रोड, पानीपत",
                postImg: "https://picsum.photos/id/54/600/500", // फूड फोटो
                caption: "पानीपत के मशहूर छोले भटूरे! पेट भर गया पर मन नहीं 😋 #foodie",
                likes: 210,
                comments: []
            }
        ];

        // पेज लोड होते ही डेटा लोड करें
        function loadInstaFeed() {
            const feed = document.getElementById('insta-posts-feed');
            feed.innerHTML = "";

            postsData.forEach(post => {
                // लोकल स्टोरेज से लाइक की स्थिति और कमेंट्स निकालें ताकि डेटा गायब न हो
                const savedLikes = localStorage.getItem(`likes_${post.id}`) || post.likes;
                const isLiked = localStorage.getItem(`isLiked_${post.id}`) === "true";
                const savedComments = JSON.parse(localStorage.getItem(`comments_${post.id}`)) || post.comments;

                let commentsHTML = "";
                savedComments.forEach(c => {
                    commentsHTML += `<div class="comment-item"><b>${c.user}</b> ${c.text}</div>`;
                });

                const postCard = document.createElement('div');
                postCard.className = 'insta-post';
                postCard.innerHTML = `
                    <div class="post-header">
                        <img src="${post.userImg}" alt="user">
                        <div class="user-info">
                            ${post.user}
                            <div class="location">${post.location}</div>
                        </div>
                    </div>
                    
                    <img class="post-img" src="${post.postImg}" alt="post">
                    
                    <div class="post-actions">
                        <span class="action-btn ${isLiked ? 'like-active' : ''}" id="btn-${post.id}" onclick="toggleLike('${post.id}')">
                            ${isLiked ? '❤️' : '🤍'}
                        </span>
                        <span class="action-btn" onclick="focusComment('${post.id}')">💬</span>
                    </div>
                    
                    <div class="likes-display" id="count-${post.id}">${savedLikes} लाइक्स</div>
                    
                    <div class="comments-section" id="box-${post.id}">
                        <div class="comment-item"><b>${post.user}</b> ${post.caption}</div>
                        ${commentsHTML}
                    </div>
                    
                    <div class="comment-form">
                        <input type="text" id="input-${post.id}" class="comment-input" placeholder="कमेंट जोड़ें...">
                        <button class="comment-post-btn" onclick="addComment('${post.id}')">Post</button>
                    </div>
                `;
                feed.appendChild(postCard);
            });
        }

        // असली लाइक टॉगल फंक्शन (हार्ट आइकॉन वाला)
        function toggleLike(postId) {
            const post = postsData.find(p => p.id === postId);
            let currentLikes = parseInt(localStorage.getItem(`likes_${postId}`)) || post.likes;
            let isLiked = localStorage.getItem(`isLiked_${postId}`) === "true";

            if (isLiked) {
                currentLikes--;
                isLiked = false;
                document.getElementById(`btn-${postId}`).innerText = "🤍";
                document.getElementById(`btn-${postId}`).classList.remove('like-active');
            } else {
                currentLikes++;
                isLiked = true;
                document.getElementById(`btn-${postId}`).innerText = "❤️";
                document.getElementById(`btn-${postId}`).classList.add('like-active');
            }

            localStorage.setItem(`likes_${postId}`, currentLikes);
            localStorage.setItem(`isLiked_${postId}`, isLiked);
            document.getElementById(`count-${postId}`).innerText = currentLikes + " लाइक्स";
        }

        // असली कमेंट जोड़ने का फंक्शन
        function addComment(postId) {
            const input = document.getElementById(`input-${postId}`);
            const text = input.value.trim();
            if (text === "") return;

            const post = postsData.find(p => p.id === postId);
            let currentComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || post.comments;

            // नया कमेंट जोड़ें
            currentComments.push({ user: "आप (You)", text: text });
            localStorage.setItem(`comments_${postId}`, JSON.stringify(currentComments));

            // स्क्रीन तुरंत अपडेट करें
            const box = document.getElementById(`box-${postId}`);
            box.innerHTML += `<div class="comment-item"><b>आप (You)</b> ${text}</div>`;
            input.value = "";
        }

        function focusComment(postId) {
            document.getElementById(`input-${postId}`).focus();
        }

        // इंस्टाग्राम चैटबॉट का फंक्शन (निचे मेसेज वाले आइकॉन पर क्लिक करने से चलेगा)
        function openChatBot() {
            const msg = prompt("पानीपत कनेक्ट चैटबॉट को अपना संदेश भेजें:");
            if(msg) {
                alert("चैटबॉट का जवाब: अरे भाई! 'Panipat Connect' का यह नया इंस्टाग्राम डिज़ाइन एकदम कतई जहर लग रहा है ना? 🔥");
            }
        }

        // फीड को पहली बार लोड करें
        loadInstaFeed();
    </script>
</body>
</html>
