<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panipat Connect | Live Dating & Friendship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-rose-50 to-pink-100 min-h-screen text-gray-800 pb-24">

    <!-- 1. टॉप बार -->
    <nav class="bg-white/80 backdrop-blur-md shadow-xs sticky top-0 z-50 px-4 py-3 flex items-center justify-between border-b border-rose-100">
        <div class="text-xl font-black text-rose-600 tracking-wide">
            PANIPAT<span class="text-gray-700 font-bold">.CONNECT</span>
        </div>
        <div class="flex items-center bg-rose-50 border border-rose-200 rounded-full px-3 py-1 text-xs md:text-sm">
            <i class="fa-solid fa-location-dot text-rose-500 mr-1.5"></i>
            <span class="font-semibold text-gray-700">Model Town, Panipat</span>
        </div>
        <!-- प्रोफाइल जोड़ने का बटन -->
        <button onclick="toggleRegisterForm()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-xs cursor-pointer">
            <i class="fa-solid fa-user-plus mr-1"></i> Join Now
        </button>
    </nav>

    <!-- 2. गुप्त रजिस्ट्रेशन फॉर्म (Popup Modal) -->
    <div id="registerModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="toggleRegisterForm()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-xl font-bold text-gray-900 mb-1">बनाएं अपनी प्रोफाइल 🌟</h3>
            <p class="text-xs text-gray-400 mb-4">आसपास के नए दोस्तों से जुड़ने के लिए जानकारी भरें</p>
            
            <form id="profileForm" onsubmit="addNewProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">आपका नाम</label>
                    <input type="text" id="regName" required placeholder="जैसे: अंजली, राहुल" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">उम्र (Age)</label>
                        <input type="number" id="regAge" required min="18" placeholder="22" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">पानीपत में इलाका</label>
                        <input type="text" id="regLoc" required placeholder="जैसे: Model Town" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">प्रोफाइल फोटो का लिंक (URL)</label>
                    <input type="url" id="regImg" placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-500">
                    <p class="text-[10px] text-gray-400 mt-0.5">*अभी के लिए आप कोई भी इंटरनेट फोटो लिंक डाल सकते हैं</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">अपने बारे में कुछ लिखें (Bio)</label>
                    <textarea id="regBio" required rows="2" placeholder="आपको क्या पसंद है? आप कैसी दोस्ती चाहते हैं..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-rose-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition">
                    प्रोफाइल लाइव करें ✨
                </button>
            </form>
        </div>
    </div>

    <!-- 3. मुख्य बैनर -->
    <div class="px-4 py-8 text-center max-w-xl mx-auto">
        <h1 class="text-2xl md:text-3xl font-black text-gray-900 leading-tight">अपने आसपास नए दोस्त ढूंढें 🌟</h1>
        <p class="text-xs md:text-sm text-gray-500 mt-1.5">पानीपत में रहने वाले लोगों से सुरक्षित और आसान तरीके से जुड़ें</p>
    </div>

    <!-- 4. प्रोफाइल्स एरिया -->
    <main class="max-w-4xl mx-auto px-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Members Online Nearby</h2>
        
        <!-- यहाँ प्रोफाइल्स अपने आप लोड होंगी -->
        <div id="profileGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <!-- 5. बॉटम ऐप बार -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-rose-100 py-2.5 px-6 flex justify-around items-center z-40 shadow-lg">
        <button class="flex flex-col items-center gap-1 text-rose-500"><i class="fa-solid fa-users text-lg"></i><span class="text-[10px] font-bold">Discover</span></button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-rose-500"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px] font-medium">Chats</span></button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-rose-500"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] font-medium">Profile</span></button>
    </div>

    <!-- जावास्क्रिप्ट डेटाबेस लॉजिक -->
    <script>
        // शुरुआती डमी डेटाबेस
        let initialProfiles = [
            { name: "अपेक्षा", age: 22, loc: "Model Town", bio: "चाय और अच्छी बातचीत पसंद है। नए दोस्त बनाने के लिए यहाँ हूँ।", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" },
            { name: "कोमल", age: 24, loc: "GT Road", bio: "किताबें पढ़ना और संगीत सुनना पसंद है। सिर्फ अच्छे लोगों से दोस्ती।", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400" }
        ];

        // प्रोफाइल्स को स्क्रीन पर दिखाने का फंक्शन
        function displayProfiles() {
            const grid = document.getElementById('profileGrid');
            grid.innerHTML = ""; // पुराना डेटा साफ़ करें
            
            initialProfiles.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 shadow-xs border border-rose-50 flex flex-col justify-between">
                        <div class="relative rounded-xl overflow-hidden aspect-square bg-gray-100">
                            <img src="${p.img || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400'}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-green-500 w-2.5 h-2.5 rounded-full border-2 border-white animate-pulse"></span>
                        </div>
                        <div class="mt-2.5">
                            <h3 class="font-bold text-base text-gray-900">${p.name}, ${p.age}</h3>
                            <p class="text-[11px] text-rose-600 font-medium mt-0.5"><i class="fa-solid fa-location-dot mr-0.5"></i> ${p.loc}</p>
                            <p class="text-xs text-gray-500 mt-1.5 line-clamp-2">"${p.bio}"</p>
                        </div>
                        <button onclick="alert('${p.name} को आपका हैलो भेज दिया गया है!')" class="mt-3 w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-1.5 rounded-xl text-xs transition shadow-xs cursor-pointer">
                            <i class="fa-solid fa-message mr-1"></i> Say Hello
                        </button>
                    </div>
                `;
            });
        }

        // फॉर्म खोलने/बंद करने का लॉजिक
        function toggleRegisterForm() {
            const modal = document.getElementById('registerModal');
            modal.classList.toggle('hidden');
        }

        // नया प्रोफाइल जोड़ने का लॉजिक
        function addNewProfile(event) {
            event.preventDefault(); // पेज रीलोड होने से रोकें
            
            const name = document.getElementById('regName').value;
            const age = document.getElementById('regAge').value;
            const loc = document.getElementById('regLoc').value;
            const img = document.getElementById('regImg').value;
            const bio = document.getElementById('regBio').value;

            // डेटाबेस में नया ऑब्जेक्ट जोड़ना
            initialProfiles.unshift({ name, age, loc, bio, img });
            
            // स्क्रीन दोबारा अपडेट करना और फॉर्म बंद करना
            displayProfiles();
            toggleRegisterForm();
            document.getElementById('profileForm').reset();
        }

        // पेज लोड होते ही प्रोफाइल्स दिखाना
        displayProfiles();
    </script>
</body>
</html>
