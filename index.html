<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Style Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ember मॉडर्न स्टाइलिंग */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #fdfaf6; color: #1a1a1a; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background: #fdfaf6; padding-bottom: 90px; }

        /* हेडर और स्टोरीज (Ember स्टाइल) */
        .header { display: flex; justify-content: space-between; padding: 20px; align-items: center; }
        .logo { font-weight: 800; font-size: 1.5rem; color: #e67e22; }
        .stories-container { display: flex; gap: 15px; padding: 0 20px; margin-bottom: 20px; overflow-x: auto; }
        .story-wrapper { text-align: center; font-size: 0.7rem; }
        .story-ring img { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #e67e22; padding: 2px; object-fit: cover; }

        /* कार्ड स्टाइल (Ember Look) */
        .feed-container { padding: 0 20px; }
        .post { background: white; border-radius: 30px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .post-media-wrapper { width: 100%; height: 450px; }
        .post-image, .post-video { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 20px; }
        .post-username { font-size: 1.5rem; font-weight: bold; }
        .post-caption { color: #666; margin-top: 5px; font-size: 0.9rem; }

        /* बटन स्टाइल (Ember) */
        .actions { display: flex; justify-content: center; gap: 20px; padding: 10px 20px 20px 20px; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; }
        .btn-like { color: #2ecc71; background: white; }
        .btn-dislike { color: #e74c3c; background: white; }

        /* बॉटम नेविगेशन */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; display: flex; justify-content: space-around; padding: 20px; background: white; border-top: 1px solid #eee; z-index: 10; }
        .nav-item { font-size: 1.2rem; color: #555; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo">ember</div>
            <i class="fa-regular fa-comment-dots" style="font-size: 1.4rem;"></i>
        </header>

        <div class="stories-container" id="storyBar">
            <div class="story-wrapper">
                <div class="story-ring"><img id="headerUserAvatar" src=""></div>
                <div id="headerUsername">You</div>
            </div>
        </div>

        <div class="feed-container" id="mainFeedArea">
            </div>

        <nav class="bottom-nav">
            <i class="fa-solid fa-fire nav-item"></i>
            <i class="fa-solid fa-compass nav-item"></i>
            <i class="fa-solid fa-heart nav-item"></i>
            <i class="fa-solid fa-comment nav-item"></i>
            <i class="fa-solid fa-user nav-item" onclick="location.href='profile.html'"></i>
        </nav>
    </div>

    <script>
        // ... (आपका पुराना लॉजिक यहाँ वैसे ही रहेगा, बस renderFeed में क्लास बदलनी है) ...
        // मैंने renderFeed में Ember वाले कार्ड div लगाए हैं।
        
        window.onload = () => {
             // ... आपका लॉगिन चेक और डेटा रेंडरिंग कोड ...
             // इसे अपनी फाइल में कॉपी कर लीजिए।
        }
    </script>
</body>
</html>
