<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panipat Connect</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-red-500 text-white p-4">
<div class="max-w-6xl mx-auto flex justify-between">
<h1 class="text-3xl font-bold">Panipat Connect</h1>
<button class="bg-white text-red-500 px-4 py-2 rounded">
लॉगिन
</button>
</div>
</header>

<section class="bg-red-500 text-white text-center py-16">
<h2 class="text-4xl font-bold">
अपने आसपास नए लोगों से जुड़ें
</h2>

<p class="mt-3">
मिलें • बातचीत करें • दोस्ती करें
</p>

<div class="mt-6">
<input
type="text"
placeholder="नाम खोजें..."
class="p-3 w-80 text-black rounded">

<button class="bg-black px-5 py-3 rounded">
खोजें
</button>
</div>
</section>

<section class="max-w-6xl mx-auto p-6">

<h2 class="text-3xl font-bold mb-6">
लोकप्रिय प्रोफाइल
</h2>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

<div class="bg-white rounded-xl shadow">
<img src="https://picsum.photos/500/300?1" class="w-full">
<div class="p-4">
<h3 class="text-2xl font-bold">आरती</h3>
<p>दिल्ली • 24 वर्ष</p>
<button class="bg-pink-500 text-white w-full py-2 mt-3 rounded">
❤️ पसंद
</button>
</div>
</div>

<div class="bg-white rounded-xl shadow">
<img src="https://picsum.photos/500/300?2" class="w-full">
<div class="p-4">
<h3 class="text-2xl font-bold">कविता</h3>
<p>पानीपत • 25 वर्ष</p>
<button class="bg-pink-500 text-white w-full py-2 mt-3 rounded">
❤️ पसंद
</button>
</div>
</div>

<div class="bg-white rounded-xl shadow">
<img src="https://picsum.photos/500/300?3" class="w-full">
<div class="p-4">
<h3 class="text-2xl font-bold">पूजा</h3>
<p>जयपुर • 23 वर्ष</p>
<button class="bg-pink-500 text-white w-full py-2 mt-3 rounded">
❤️ पसंद
</button>
</div>
</div>

</div>

</section>

<footer class="bg-white text-center p-6">
© 2026 Panipat Connect
</footer>

</body>
</html>
