<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomato Dating</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">❤️ Zomato Dating</div>
  <button onclick="toggleTheme()">🌙</button>
</div>

<!-- MAIN -->
<div class="container">

  <!-- LEFT MENU -->
  <div class="sidebar">
    <div class="nav">🏠 Home</div>
    <div class="nav">🔥 Matches</div>
    <div class="nav">💬 Chat</div>
    <div class="nav">👤 Profile</div>
  </div>

  <!-- CENTER -->
  <div class="main">

    <!-- PROFILE CARDS -->
    <div class="card">
      <h2>Find Your Match 💘</h2>
      <p>Swipe & Connect with People</p>
    </div>

    <div id="cards"></div>

    <button class="btn" onclick="loadProfiles()">Load Profiles</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
