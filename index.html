<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panipat Connect - Permanent Instagram</title>
    
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: '-apple-system', BlinkMacSystemFont, sans-serif; 
            background-color: #fafafa; color: #262626; transition: background 0.3s;
        }
        .insta-header { 
            background-color: white; border-bottom: 1px solid #dbdbdb; 
            position: sticky; top: 0; z-index: 100; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .insta-header h1 { font-size: 22px; font-weight: bold; margin: 0; color: #e53935; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        
        .header-auth-btn {
            background-color: #0095f6; color: white; border: none; padding: 6px 14px;
            border-radius: 4px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .user-badge { font-size: 13px; font-weight: bold; display: none; gap: 8px; align-items: center; }
        .logout-btn { color: #e53935; cursor: pointer; font-weight: bold; font-size: 14px; }

        .main-container { max-width: 600px; margin: 0 auto; padding-bottom: 80px; }

        /* स्टोरीज़ */
        .stories-container { 
            display: flex; gap: 12px; overflow-x: auto; padding: 15px 10px; 
            background: white; border-bottom: 1px solid #dbdbdb; margin-bottom: 10px;
        }
        .stories-container::-webkit-scrollbar { display: none; }
        .story { text-align: center; font-size: 11px; min-width: 65px; }
        .story-img-wrapper { width: 56px; height: 56px; border-radius: 50%; padding: 2px; border: 2px solid #e53935; margin: 0 auto 4px auto; }
        .story img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* पोस्ट्स */
        .insta-post { background: white; border: 1px solid #dbdbdb; margin-bottom: 15px; border-radius: 4px; }
        .post-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .post-header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .post-header .user-info { font-size: 14px; font-weight: 600; }
        .post-img { width: 100%; max-height: 500px; object-fit: cover; }
        .post-actions { padding: 10px 12px 5px 12px; display: flex; gap: 15px; font-size: 22px; }
        .action-btn { cursor: pointer; user-select: none; }
        .likes-display { padding: 0 12px; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .comments-section { padding: 0 12px; font-size: 14px; margin-bottom: 8px; }

        /* पॉप-अप फॉर्म */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-popup { background: white; padding: 30px; border-radius: 8px; width: 320px; text-align: center; position: relative; color: #262626; }
        .close-popup { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; }
        .auth-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #dbdbdb; border-radius: 4px; box-sizing: border-box; }
        .auth-btn { width: 100%; padding: 8px; background-color: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .toggle-text { font-size: 13px; color: #8e8e8e; cursor: pointer; margin-top: 10px; }
        .toggle-text span { color: #0095f6; font-weight: bold; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #dbdbdb;
            display: flex; justify-content: space-around; padding: 12px 0; font-size: 20px; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- हेडर -->
    <div class="insta-header">
        <h1>Panipat Connect</h1>
        <div class="header-right">
            <!-- ➕ फोटो अपलोड बटन -->
            <input type="file" id="insta-file-input" accept="image/*" style="display:none;">
            <button onclick="triggerFileSelect()" style="background:none; border:none; font-size:24px; cursor:pointer; padding:0;">➕</button>
            
            <!-- लॉगिन/यूजर इंफो -->
            <button class="header-auth-btn" id="login-trigger-btn" onclick="openAuthModal()">लॉग इन करें</button>
            <div class="user-badge" id="user-profile-badge">
                <span id="logged-username">@username</span>
                <span class="logout-btn" onclick="handleLogout()">✕</span>
            </div>
        </div>
    </div>

    <!-- मुख्य कंटेनर -->
    <div class="main-container">
        <!-- स्टोरीज़ -->
        <div class="stories-container">
            <div class="story"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=11"></div><span>विकास</span></div>
            <div class="story"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=5"></div><span>कविता</span></div>
            <div class="story"><div class="story-img-wrapper"><img src="https://i.pravatar.cc/150?img=12"></div><span>संदीप</span></div>
        </div>

        <!-- यहाँ पोस्ट्स दिखेंगी -->
        <div id="insta-posts-feed"></div>
        
        <!-- रील्स सेक्शन -->
        <div style="margin-top: 30px; border-top: 1px solid #dbdbdb; padding-top: 20px;">
            <h2 style="font-size: 18px; padding: 0 10px;">🎬 रील्स (Reels)</h2>
            <div class="insta-post">
                <div class="post-header">
                    <img src="https://i.pravatar.cc/150?img=13">
                    <div class="user-info">दीपक हुड्डा</div>
                </div>
                <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls loop muted style="width:100%; max-height:500px; background:black;"></video>
            </div>
        </div>
    </div>

    <!-- लॉगिन/साइनअप पॉप-अप -->
    <div class="modal-overlay" id="auth-modal">
        <div class="auth-popup">
            <span class="close-popup" onclick="closeAuthModal()">&times;</span>
            
            <!-- लॉगिन बॉक्स -->
            <div id="login-box">
                <h2>लॉग इन</h2>
                <input type="text" id="login-user" class="auth-input" placeholder="यूज़रनेम">
                <input type="password" id="login-pass" class="auth-input" placeholder="पासवर्ड">
                <button class="auth-btn" onclick="handleLogin()">लॉग इन करें</button>
                <p class="toggle-text" onclick="toggleForm(true)">अकाउंट नहीं है? <span>साइन अप</span></p>
            </div>

            <!-- साइनअप बॉक्स -->
            <div id="signup-box" style="display: none;">
                <h2>साइन अप (नया अकाउंट)</h2>
                <input type="text" id="sign-username" class="auth-input" placeholder="नया यूज़रनेम बनाएं">
                <input type="password" id="sign-pass" class="auth-input" placeholder="एक मजबूत पासवर्ड चुनें">
                <button class="auth-btn" onclick="handleSignup()">अकाउंट बनाएं</button>
                <p class="toggle-text" onclick="toggleForm(false)">पहले से खाता है? <span>लॉग इन</span></p>
            </div>
        </div>
    </div>

    <!-- नीचे का मेनू बार -->
    <div class="bottom-nav">
        <div style="cursor:pointer;" onclick="window.scrollTo({top:0, behavior:'smooth'});">🏠</div>
        <div style="cursor:pointer;" onclick="alert('चैट रूम चालू है!')">💬</div>
        <div style="cursor:pointer;" id="dark-mode-btn">🌙</div>
    </div>

    <script>
        // 💾 लोकल स्टोरेज से डेटा लोड करना ताकि रिफ्रेश पर डिलीट न हो
        let usersDatabase = JSON.parse(localStorage.getItem('usersDatabase')) || {};
        let loggedInUser = localStorage.getItem('loggedInUser') || null;
        let localPosts = JSON.parse(localStorage.getItem('localPosts')) || [];

        // डिफ़ॉल्ट डमी पोस्ट्स
        const defaultPosts = [
            { id: "p1", user: "विकास मलिक", userImg: "https://i.pravatar.cc/150?img=11", postImg: "https://picsum.photos/id/10/600/500", caption: "पानीपत का मौसम! 🌤️" }
        ];

        // 🛠️ फीड लोड करने का असली फंक्शन
        function loadFeed() {
            const feed = document.getElementById('insta-posts-feed');
            feed.innerHTML = "";
            
            // दोनों डिफ़ॉल्ट और यूजर द्वारा अपलोड की गई पोस्ट्स को जोड़ना
            const allPosts = [...localPosts, ...defaultPosts];
            
            allPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'insta-post';
                card.innerHTML = `
                    <div class="post-header">
                        <img src="${post.userImg || 'https://i.pravatar.cc/150?img=3'}">
                        <div class="user-info">${post.user}</div>
                    </div>
                    <img class="post-img" src="${post.postImg}">
                    <div class="post-actions"><span class="action-btn" onclick="toggleLike(this)">🤍</span></div>
                    <div class="likes-display">0 लाइक्स</div>
                    <div class="comments-section"><b>${post.user}</b> ${post.caption}</div>
                `;
                feed.appendChild(card);
            });
        }

        // 📝 असली साइनअप (डेटाबेस में हमेशा के लिए सेव)
        function handleSignup() {
            const user = document.getElementById('sign-username').value.trim().toLowerCase();
            const pass = document.getElementById('sign-pass').value;

            if(!user || !pass) { alert("कृपया दोनों फ़ील्ड भरें!"); return; }
            if(usersDatabase[user]) { alert("यह यूज़रनेम पहले से बुक है!"); return; }

            usersDatabase[user] = pass;
            localStorage.setItem('usersDatabase', JSON.stringify(usersDatabase)); // ब्राउज़र में सेव
            
            logInTheUser(user);
            alert("🎉 आपका अकाउंट सफलतापूर्वक बन गया है!");
        }

        // 🔑 असली लॉगिन सिस्टम
        function handleLogin() {
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;

            if(usersDatabase[user] && usersDatabase[user] === pass) {
                logInTheUser(user);
            } else {
                alert("गलत यूज़रनेम या पासवर्ड! पहले साइन अप करें।");
            }
        }

        function logInTheUser(user) {
            loggedInUser = user;
            localStorage.setItem('loggedInUser', user);
            document.getElementById('login-trigger-btn').style.display = 'none';
            const badge = document.getElementById('user-profile-badge');
            badge.style.display = 'flex';
            document.getElementById('logged-username').innerText = "@" + user;
            closeAuthModal();
            loadFeed();
        }

        function handleLogout() {
            localStorage.removeItem('loggedInUser');
            loggedInUser = null;
            document.getElementById('login-trigger-btn').style.display = 'block';
            document.getElementById('user-profile-badge').style.display = 'none';
            loadFeed();
        }

        // 📸 असली फोटो अपलोड (रिफ्रेश करने पर भी नहीं उड़ेगी)
        function triggerFileSelect() { document.getElementById('insta-file-input').click(); }
        
        document.getElementById('insta-file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const caption = prompt("अपनी पोस्ट का कैप्शन लिखें:");
            if (caption === null) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const newPost = {
                    id: "custom_" + Date.now(),
                    user: loggedInUser ? "@" + loggedInUser : "अतिथि_यूजर",
                    userImg: "https://i.pravatar.cc/150?img=3",
                    postImg: event.target.result,
                    caption: caption
                };

                localPosts.unshift(newPost); // लिस्ट में सबसे ऊपर जोड़ें
                localStorage.setItem('localPosts', JSON.stringify(localPosts)); // लोकल स्टोरेज में सेव!
                loadFeed(); // फीड रीलोड करें
            };
            reader.readAsDataURL(file);
        });

        // बाकी यूटिलिटी फंक्शन्स
        function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
        function toggleForm(showSignup) {
            document.getElementById('login-box').style.display = showSignup ? 'none' : 'block';
            document.getElementById('signup-box').style.display = showSignup ? 'block' : 'none';
        }
        function toggleLike(el) { el.innerText = el.innerText === '🤍' ? '❤️' : '🤍'; }

        // डार्क मोड ऑन/ऑफ बटन
        document.getElementById('dark-mode-btn').addEventListener('click', function() {
            if (document.body.style.backgroundColor === 'rgb(18, 18, 18)') {
                document.body.style.backgroundColor = '#fafafa'; document.body.style.color = '#262626'; this.innerText = "🌙";
            } else {
                document.body.style.backgroundColor = '#121212'; document.body.style.color = '#f5f5f5'; this.innerText = "☀️";
            }
        });

        // पेज लोड होते ही चेक करें कि क्या यूजर पहले से लॉग इन है
        if (loggedInUser) { logInTheUser(loggedInUser); } else { loadFeed(); }
    </script>
    <!-- Profile Popup -->
<div id="profilePopup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
z-index:9999;
justify-content:center;
align-items:center;
">

<div style="
background:white;
width:90%;
max-width:500px;
border-radius:20px;
padding:20px;
text-align:center;
">

<img src="https://i.pravatar.cc/200"
style="
width:120px;
height:120px;
border-radius:50%;
border:5px solid #ef4444;
">

<h2 style="font-size:30px;margin-top:15px;">
मेरा प्रोफाइल
</h2>

<p style="font-size:18px;">
@panipat_user
</p>

<div style="
display:flex;
justify-content:space-around;
margin-top:20px;
">

<div>
<h3>25</h3>
<p>पोस्ट</p>
</div>

<div>
<h3>450</h3>
<p>फॉलोअर्स</p>
</div>

<div>
<h3>210</h3>
<p>फॉलोइंग</p>
</div>

</div>

<button onclick="closeProfile()"
style="
margin-top:20px;
background:#ef4444;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
">
बंद करें
</button>

</div>
</div>

<script>
function openProfile(){
document.getElementById('profilePopup').style.display='flex';
}

function closeProfile(){
document.getElementById('profilePopup').style.display='none';
}
</script>
</body>
</html>
