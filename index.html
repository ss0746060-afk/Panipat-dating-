    window.addEventListener('load', () => {
        const savedUser = localStorage.getItem('vip_user') || "राव_साहब_HR06";
        const savedPic = localStorage.getItem('vip_pic') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100";
        document.getElementById('headerUsername').innerText = savedUser;
        document.getElementById('headerUserAvatar').src = savedPic;
        
        // फीड रेंडर करना
        renderLiveFeed();
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function triggerUpload(type) {
        closeModal('instagramUploadModal');
        if(type === 'photo' || type === 'video') { document.getElementById('photoVideoInput').click(); } 
        else if(type === 'reel') { document.getElementById('reelInput').click(); }
    }

    // लॉगआउट फंक्शन
    function processLogout() {
        if(confirm("क्या आप सच में लॉगआउट करना चाहते हैं?")) {
            localStorage.removeItem('current_logged_in_user');
            localStorage.removeItem('vip_name');
            localStorage.removeItem('vip_user');
            localStorage.removeItem('vip_pic');
            window.location.href = 'login.html';
        }
    }

    // नया कन्टेंट अपलोड प्रोसेसिंग
    function processUpload(event, mode) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const mediaUrl = e.target.result;
            const myName = localStorage.getItem('vip_name') || "अमित राव";
            const myPic = localStorage.getItem('vip_pic') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100";
            const currentUser = localStorage.getItem('current_logged_in_user');
            
            let isVideo = file.type.startsWith('video');
            let savedItems = JSON.parse(localStorage.getItem('my_uploaded_media') || '[]');
            
            savedItems.unshift({ 
                authorName: myName,
                authorPic: myPic,
                location: "पानीपत • अभी-अभी",
                type: mode === 'reel' ? 'reel' : (isVideo ? 'video' : 'photo'), 
                url: mediaUrl, 
                likes: "1 लाइक",
                caption: "नयी वीआईपी पोस्ट लाइव! 🔥 #ZomatoDating",
                owner: currentUser
            });
            
            localStorage.setItem('my_uploaded_media', JSON.stringify(savedItems));
            renderLiveFeed();
            alert('आपकी पोस्ट जादुई तरीके से फीड में सबसे ऊपर लाइव हो गई! 🚀');
        };
        reader.readAsDataURL(file);
    }

    // 🌟 असली मास्टर रेंडरर: आपके द्वारा अपलोड किए गए पोस्ट और 10 डमी प्रोफाइल्स को मिक्स करेगा
    function renderLiveFeed() {
        const mySavedItems = JSON.parse(localStorage.getItem('my_uploaded_media') || '[]');
        
        // आपके असली पोस्ट हमेशा टॉप पर रहेंगे, उसके बाद ये 10 डमी प्रोफाइल्स मिक्स हो जाएँगी
        const fullFeed = [...mySavedItems, ...dummyInstagramFeed];
        let feedHtml = '';

        fullFeed.forEach(item => {
            let mediaHtml = '';
            
            if (item.type === 'photo') {
                mediaHtml = `<img src="${item.url}" class="post-image" alt="Post Content">`;
            } else if (item.type === 'video' || item.type === 'reel') {
                // रील और वीडियो के लिए वीडियो टैग ऑटोप्ले और लूप के साथ
                mediaHtml = `<video src="${item.url}" class="post-video" controls loop muted autoplay></video>`;
            }

            feedHtml += `
                <div class="post ${item.type === 'reel' ? 'reel-style' : ''}">
                    <div class="post-header">
                        <div class="post-user-info">
                            <img src="${item.authorPic}" class="post-avatar" alt="Avatar">
                            <div>
                                <div class="post-username">${item.authorName} ${item.type === 'reel' ? '• <span style="color:#ff007f; font-weight:bold;">रिल 🎬</span>' : ''}</div>
                                <div class="post-location">${item.location}</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <div class="post-media-wrapper">
                        ${mediaHtml}
                    </div>
                    <div class="post-actions">
                        <div class="left-actions">
                            <i class="fa-solid fa-heart liked"></i>
                            <i class="fa-regular fa-comment action-btn" onclick="alert('कमेंट बॉक्स पर काम चल रहा है भाई!')"></i>
                            <i class="fa-regular fa-paper-plane action-btn"></i>
                        </div>
                        <i class="fa-regular fa-bookmark action-btn"></i>
                    </div>
                    <div class="post-likes">${item.likes}</div>
                    <div class="post-caption">
                        <span>${item.authorName}</span>${item.caption}
                    </div>
                </div>
            `;
        });
        
        document.getElementById('mainFeed').innerHTML = feedHtml;
    }
