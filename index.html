<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">MySocial</div>
            <div class="icons">❤️ 📩</div>
        </header>

        <main id="feed">
            <div class="post">
                <div class="user-info">👤 यूजर का नाम</div>
                <div class="post-content">यहाँ आपकी फोटो या वीडियो आएगी</div>
                <div class="actions">👍 💬 ✈️</div>
            </div>
            </main>

        <nav class="bottom-nav">
            <button onclick="changePage('Home')">🏠</button>
            <button onclick="changePage('Inbox')">📥</button>
            <button onclick="changePage('Explore')">🔍</button>
            <button onclick="changePage('Profile')">👤</button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
