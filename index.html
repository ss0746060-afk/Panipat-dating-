    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #05010d; color: #ffffff; display: flex; justify-content: center;

        }

        .app-container {
            width: 100%; max-width: 450px; background: rgba(15, 8, 28, 0.8);
            min-height: 100vh; display: flex; flex-direction: column; position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 70px;
        }

        .app-header {
            position: sticky; top: 0; background: rgba(5, 1, 13, 0.95); backdrop-filter: blur(10px);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); z-index: 10;
        }

        .brand-logo {
            font-size: 1.6rem; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(45deg, #ff007f, #ff4b2b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.3); cursor: pointer;
        }

        .header-icons { display: flex; gap: 20px; font-size: 1.3rem; align-items: center; }
        .header-icons i { cursor: pointer; }
        
        .logout-btn { color: #ff3b30; transition: transform 0.2s; }
        .logout-btn:hover { transform: scale(1.1); }

        .stories-container {
            display: flex; gap: 15px; padding: 15px; overflow-x: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(255, 255, 255, 0.01);
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-wrapper { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #8b8ba7; cursor: pointer; min-width: 65px; }
        .story-ring { width: 65px; height: 65px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #00f0ff, #ff007f, #7928ca); margin-bottom: 5px; position: relative; }
        .add-story-badge { position: absolute; bottom: 2px; right: 2px; background: #ff007f; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 0.7rem; border: 2px solid #05010d; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #140a23; border: 2px solid #05010d; }

        /* फीड स्टाइल */
        .feed-container { display: flex; flex-direction: column; }
        .post { border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 15px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; }
        .post-user-info { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1.5px solid #00f0ff; object-fit: cover; }
        .post-username { font-weight: 600; font-size: 0.95rem; }
        .post-location { font-size: 0.75rem; color: #00f0ff; }
        
        .post-media-wrapper { width: 100%; position: relative; background: #000; display: flex; justify-content: center; }
        .post-image { width: 100%; max-height: 450px; object-fit: cover; }
        .post-video { width: 100%; max-height: 450px; background: #000; }
        
        .post.reel-style .post-media-wrapper { aspect-ratio: 9 / 16; max-height: 550px; }
        .post.reel-style .post-video { height: 100%; max-height: 550px; object-fit: cover; }

        .post-actions { padding: 12px 15px; display: flex; justify-content: space-between; font-size: 1.35rem; }
        .left-actions { display: flex; gap: 20px; }
        .action-btn { cursor: pointer; transition: transform 0.2s; }
        .fa-heart.liked { color: #ff007f; }

        .post-likes { padding: 0 15px; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        .post-caption { padding: 0 15px; font-size: 0.9rem; line-height: 1.4; }
        .post-caption span { font-weight: bold; margin-right: 8px; }

        /* बॉटम नेविगेशन */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; max-width: 450px;
            background: rgba(5, 1, 13, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex;
            justify-content: space-around; align-items: center; padding: 15px 0; font-size: 1.4rem; z-index: 10;
        }
        .nav-item { cursor: pointer; color: #8b8ba7; text-decoration: none; }
        .nav-item.active { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }

        /* मॉडल */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 1, 13, 0.95); backdrop-filter: blur(8px); z-index: 100;
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { width: 100%; max-width: 450px; height: auto; background: #0d061a; border-radius: 24px 24px 0 0; margin-top: auto; padding-bottom: 20px; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .modal-close { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        .upload-option-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 15px; margin: 10px 0; border-radius: 12px; font-weight: bold;
            display: flex; align-items: center; gap: 15px; cursor: pointer; font-size: 1rem; width: 100%;
            transition: 0.2s;
        }
        .upload-option-btn:hover { background: rgba(255, 0, 127, 0.15); border-color: #ff007f; }
    </style>

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('vip_user') || "राव_साहब_HR06";
            const savedPic = localStorage.getItem('vip_pic') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100";
            
            document.getElementById('headerUsername').innerText = savedUser;
            document.getElementById('headerUserAvatar').src = savedPic;
            
            renderLiveFeed();
        });

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function triggerUpload(type) {
            closeModal('instagramUploadModal');
            if(type === 'photo' || type === 'video') { document.getElementById('photoVideoInput').click(); } 
            else if(type === 'reel') { document.getElementById('reelInput').click(); }
        }

        function processLogout() {
            if(confirm("क्या आप सच में लॉगआउट करना चाहते हैं?")) {
                localStorage.removeItem('current_logged_in_user');
                localStorage.removeItem('vip_name');
                localStorage.removeItem('vip_user');
                localStorage.removeItem('vip_pic');
                window.location.href = 'login.html';
            }
        }

        function processUpload(event, mode) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const mediaUrl = e.target.result;
                const myName = localStorage.getItem('vip_name') || "अमित राव";
                const myPic = localStorage.getItem('vip_pic') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100";
                const currentUser = localStorage.getItem('current_logged_in_user');
                
                let isVideo = file.type.startsWith('video');
                let savedItems = JSON.parse(localStorage.getItem('my_uploaded_media') || '[]');
                
                savedItems.unshift({ 
                    authorName: myName,
                    authorPic: myPic,
                    location: "पानीपत • अभी-अभी",
                    type: mode === 'reel' ? 'reel' : (isVideo ? 'video' : 'photo'), 
                    url: mediaUrl, 
                    likes: "1 लाइक",
                    caption: "नयी वीआईपी पोस्ट लाइव! 🔥 #ZomatoDating",
                    owner: currentUser
                });
                
                localStorage.setItem('my_uploaded_media', JSON.stringify(savedItems));
                renderLiveFeed();
                alert('आपकी पोस्ट जादुई तरीके से फीड में सबसे ऊपर लाइव हो गई! 🚀');
            };
            reader.readAsDataURL(file);
        }

        function renderLiveFeed() {
            const mySavedItems = JSON.parse(localStorage.getItem('my_uploaded_media') || '[]');
            const fullFeed =
